<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account Login | B-Tech System</title>


<style>

/* =========================
GLOBAL STYLE
========================= */

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;

}


body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:

linear-gradient(
135deg,
#0f172a,
#2563eb
);

}


/* =========================
AUTH CONTAINER
========================= */


.auth-container{

width:420px;

background:white;

border-radius:18px;

padding:35px;

box-shadow:

0 20px 50px rgba(0,0,0,0.25);

}


/* =========================
HEADER
========================= */


.logo{

text-align:center;

margin-bottom:25px;

}


.logo h1{

font-size:28px;

color:#1e3a8a;

}


.logo p{

color:#64748b;

font-size:14px;

margin-top:8px;

}



/* =========================
TABS
========================= */


.tabs{

display:flex;

margin-bottom:25px;

background:#f1f5f9;

border-radius:10px;

overflow:hidden;

}


.tabs button{

flex:1;

padding:12px;

border:none;

background:none;

cursor:pointer;

font-size:15px;

font-weight:600;

}


.tabs button.active{

background:#2563eb;

color:white;

}



/* =========================
FORMS
========================= */


.form-box{

display:none;

}


.form-box.active{

display:block;

}



.form-group{

margin-bottom:18px;

}



.form-group label{

display:block;

margin-bottom:7px;

font-weight:600;

font-size:14px;

color:#334155;

}



.form-group input{

width:100%;

padding:13px;

border:1px solid #cbd5e1;

border-radius:10px;

font-size:15px;

outline:none;

}


.form-group input:focus{

border-color:#2563eb;

}



/* =========================
BUTTON
========================= */


.submit-btn{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;

}


.submit-btn:hover{

background:#1d4ed8;

}


/* =========================
MESSAGE BOX
========================= */


.message{

text-align:center;

margin-top:15px;

font-size:14px;

color:red;

}



/* =========================
PASSWORD TOGGLE
========================= */


.password-box{

position:relative;

}


.password-box span{

position:absolute;

right:12px;

top:13px;

cursor:pointer;

font-size:14px;

color:#2563eb;

}



</style>


</head>


<body>


<div class="auth-container">


<div class="logo">

<h1>B-Tech System</h1>

<p>Secure Account Access</p>

</div>



<div class="tabs">

<button 
id="loginTab"
class="active"
onclick="showLogin()">

Login

</button>


<button 
id="registerTab"
onclick="showRegister()">

Create Account

</button>


</div>





<!-- =========================
LOGIN FORM
========================= -->


<div id="loginForm" class="form-box active">


<div class="form-group">

<label>
Username
</label>


<input 
type="text"
id="loginUsername"
placeholder="Enter username">

</div>



<div class="form-group">


<label>
Password
</label>


<div class="password-box">


<input 
type="password"
id="loginPassword"
placeholder="Enter password">


<span onclick="togglePassword('loginPassword')">

Show

</span>


</div>


</div>



<button 
class="submit-btn"
onclick="loginUser()">

Login

</button>


</div>





<!-- =========================
REGISTER FORM
========================= -->


<div id="registerForm" class="form-box">


<div class="form-group">

<label>
Full Name
</label>


<input 
type="text"
id="fullName"
placeholder="Enter full name">

</div>



<div class="form-group">

<label>
Username
</label>


<input 
type="text"
id="registerUsername"
placeholder="Create username">

</div>



<div class="form-group">

<label>
Password
</label>


<div class="password-box">


<input 
type="password"
id="registerPassword"
placeholder="Create password">


<span onclick="togglePassword('registerPassword')">

Show

</span>


</div>

</div>

<!-- =========================
CONFIRM PASSWORD
========================= -->


<div class="form-group">

<label>
Confirm Password
</label>


<div class="password-box">


<input 
type="password"
id="confirmPassword"
placeholder="Confirm password">


<span onclick="togglePassword('confirmPassword')">

Show

</span>


</div>

</div>




<button 
class="submit-btn"
onclick="registerUser()">

Create Account

</button>


</div>





<!-- =========================
MESSAGE AREA
========================= -->


<div id="message" class="message"></div>




<div style="
text-align:center;
margin-top:25px;
font-size:13px;
color:#64748b;
">

© 2026 B-Tech System

</div>



</div>





<script>

<script>


// =========================
// SWITCH LOGIN / REGISTER
// =========================


function showLogin(){

document.getElementById("loginForm").classList.add("active");

document.getElementById("registerForm").classList.remove("active");


document.getElementById("loginTab").classList.add("active");

document.getElementById("registerTab").classList.remove("active");


clearMessage();

}




function showRegister(){


document.getElementById("registerForm").classList.add("active");


document.getElementById("loginForm").classList.remove("active");


document.getElementById("registerTab").classList.add("active");


document.getElementById("loginTab").classList.remove("active");


clearMessage();

}




// =========================
// PASSWORD SHOW / HIDE
// =========================


function togglePassword(id){


let input=document.getElementById(id);


if(input.type==="password"){

input.type="text";

}
else{

input.type="password";

}


}





// =========================
// CREATE ACCOUNT
// =========================


function registerUser(){


let name=document.getElementById("fullName").value.trim();


let username=document.getElementById("registerUsername").value.trim();


let password=document.getElementById("registerPassword").value;


let confirm=document.getElementById("confirmPassword").value;



if(name==="" || username==="" || password==="" || confirm===""){


showMessage("Please fill all fields");


return;

}



if(password.length < 4){


showMessage("Password must be at least 4 characters");


return;

}



if(password !== confirm){


showMessage("Passwords do not match");


return;

}





let users=
JSON.parse(localStorage.getItem("users")) || [];





let existingUser =
users.find(
user=>user.username===username
);



if(existingUser){


showMessage("Username already exists");


return;


}




let newUser={


name:name,

username:username,

password:password


};





users.push(newUser);


localStorage.setItem(
"users",
JSON.stringify(users)
);





showMessage(
"Account created successfully. Login now.",
"green"
);



showLogin();

}




// =========================
// LOGIN USER
// =========================


function loginUser(){



let username=
document.getElementById("loginUsername").value.trim();



let password=
document.getElementById("loginPassword").value;





let users=
JSON.parse(localStorage.getItem("users")) || [];





let user =
users.find(
u =>
u.username===username &&
u.password===password

);





if(user){



localStorage.setItem(
"currentUser",
JSON.stringify(user)
);



localStorage.setItem(
"isLoggedIn",
"true"
);





// Change this to your first page

window.location.href="dashboard.html";



}

else{



showMessage(
"Invalid username or password"
);



}



}




// =========================
// MESSAGE DISPLAY
// =========================


function showMessage(text,color="red"){


let box=document.getElementById("message");


box.innerHTML=text;


box.style.color=color;


}





function clearMessage(){


document.getElementById("message").innerHTML="";


}





// =========================
// AUTO REDIRECT IF LOGGED IN
// =========================


window.onload=function(){



if(localStorage.getItem("isLoggedIn")=="true"){


window.location.href="dashboard.html";


}


}





</script>

</script>


</body>

</html>
